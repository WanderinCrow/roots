<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roots</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ── Header ── -->
    <header class="app-header">
      <h1 class="app-title">ROOTS</h1>
      <nav class="page-nav">
        <button class="page-btn active" data-page="scales">Scales</button>
        <button class="page-btn" data-page="chords">Chords</button>
      </nav>
    </header>

    <main class="main-panel">

      <!-- ── Scale page ── -->
      <section class="page" id="page-scales">
        <div class="scale-selector">
          <label class="selector-label">Scale</label>
          <div class="scale-tabs" id="scaleTabs"></div>
        </div>
        <div class="note-grid" id="scaleGrid"></div>
        <div class="degree-row" id="scaleDegreeRow"></div>
      </section>

      <!-- ── Chord page ── -->
      <section class="page hidden" id="page-chords">
        <div class="scale-selector">
          <label class="selector-label">Chord</label>
          <div class="scale-tabs" id="chordTabs"></div>
          <button class="play-btn" id="playChordBtn" title="Play chord">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
          </button>
        </div>
        <div class="note-grid" id="chordGrid"></div>
        <div class="degree-row" id="chordDegreeRow"></div>
        <div class="tuning-selector">
          <label class="selector-label">Tuning</label>
          <select class="tuning-select" id="tuningSelect"></select>
        </div>

        <div class="fretboard-wrap">
          <div id="fretboardSvg"></div>
          <div class="position-row">
            <span class="selector-label">Position</span>
            <input type="range" id="positionSlider" class="position-slider" min="0" max="8" value="0" step="1" />
            <span class="position-display" id="positionDisplay">Open</span>
          </div>
        </div>
      </section>


    </main>
  </div>

  <!-- ── Custom tuning modal ── -->
  <div class="modal-overlay hidden" id="customTuningModal">
    <div class="modal-box">
      <p class="modal-title">Custom Tuning</p>
      <div class="modal-strings" id="modalStrings"></div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" id="btnCustomCancel">Cancel</button>
        <button class="modal-btn modal-btn-apply" id="btnCustomApply">Apply</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
