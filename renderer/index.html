<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roots</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ── Header ── -->
    <header class="app-header">
      <h1 class="app-title">ROOTS</h1>
      <nav class="page-nav">
        <button class="page-btn active" data-page="scales">Scales</button>
        <button class="page-btn" data-page="chords">Chords</button>
      </nav>
    </header>

    <main class="main-panel">

      <!-- ── Scale page ── -->
      <section class="page" id="page-scales">
        <div class="scale-selector">
          <label class="selector-label">Scale</label>
          <div class="scale-tabs" id="scaleTabs"></div>
        </div>
        <div class="note-grid" id="scaleGrid"></div>
        <div class="degree-row" id="scaleDegreeRow"></div>
      </section>

      <!-- ── Chord page ── -->
      <section class="page hidden" id="page-chords">
        <div class="scale-selector">
          <label class="selector-label">Chord</label>
          <div class="scale-tabs" id="chordTabs"></div>
        </div>
        <div class="note-grid" id="chordGrid"></div>
        <div class="degree-row" id="chordDegreeRow"></div>
        <div class="tuning-selector">
          <label class="selector-label">Tuning</label>
          <select class="tuning-select" id="tuningSelect"></select>
        </div>

        <div class="chord-diagram-row">
          <div class="chord-diagram-box" id="chordDiagramA">
            <span class="diagram-label" id="diagramLabelA"></span>
            <div class="diagram-svg" id="diagramSvgA"></div>
          </div>
          <div class="chord-diagram-box" id="chordDiagramB">
            <span class="diagram-label" id="diagramLabelB"></span>
            <div class="diagram-svg" id="diagramSvgB"></div>
          </div>
        </div>
      </section>

      <!-- ── Root slider (shared) ── -->
      <div class="slider-section">
        <div class="slider-meta">
          <span class="slider-label">Root</span>
          <span class="root-display" id="rootDisplay">A</span>
        </div>
        <div class="slider-track-wrap">
          <div class="slider-note-labels" id="sliderLabels"></div>
          <input
            type="range"
            id="rootSlider"
            class="root-slider"
            min="0"
            max="11"
            value="9"
            step="1"
          />
        </div>
      </div>

    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
